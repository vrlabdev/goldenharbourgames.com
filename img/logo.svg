  <rect x="54" y="87" width="40" height="5" rx="2.5" fill="#e8b04b"/>
  <g stroke="#0b1626" stroke-linecap="round">
    <path d="M10 54H82" stroke-width="2"/>
    <path d="M28 62L32 36L36 62M56 62L60 36L64 62" stroke-width="2.5" stroke-linejoin="round"/>
