<svg class="skyline" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b1626"/>
    <stop offset="0.62" stop-color="#1c2c44"/>
    <stop offset="1" stop-color="#6b4a2a"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1a2638"/>
    <stop offset="1" stop-color="#08111d"/>
  </linearGradient>
  <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffd98a"/>
    <stop offset="0.35" stop-color="#e9b04c" stop-opacity="0.8"/>
    <stop offset="1" stop-color="#e9b04c" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1200" height="300" fill="url(#sky)"/>
<circle cx="600" cy="296" r="150" fill="url(#sun)"/>
<circle cx="600" cy="296" r="30" fill="#ffd98a"/>
